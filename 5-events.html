<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Fundamentals</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        function Alert1() {
            function handleAlertClick(event) {
                console.log(event);
                alert('Alert message');
            }

            return (
                <button type="button" onClick={handleAlertClick}>
                    Show alert
                </button>
            )
        }

        function Alert2() {
            function handleAlertClick(msg) {
                console.log(event);
                alert(msg);
            }

            return (
                <button onClick={() => handleAlertClick("alert message with parameter")}>
                    alert with parameter
                </button>
            )
        }

        function Alert3() {
            function handleAlertClick(event) {
                console.log(event);
                alert(event.target.previousSibling.value);
            }

            function handleInputChange(event) {
                console.log(event.target.value)
            }

            return (
                <div>
                    <input 
                        type="text"
                        placeholder="Typing something..."
                        onChange={handleInputChange}
                    />
                    
                    <button onClick={handleAlertClick}>
                        alert with text
                    </button>
                </div>
            )
        }

        function App() {
            return (
            <main class="p-3">
                <Alert1/>  
                <Alert2/>
                <Alert3/>   
            </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/ >)
    </script>

    
</body>

</html>
