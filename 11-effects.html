<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Fundamentals</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function Counter() {
            const [counter, setCounter] = React.useState(0)
            const [name, setName] = React.useState('')

            React.useEffect(() => {
                console.log('Amounted component!')

                return () => {
                    console.log('Unset component!')
                    }
                }, [])

             React.useEffect(() => {
                if (counter > 0) {
                console.log(`Update counter: ${counter}`)
                }
            }, [counter])

            React.useEffect(() => {
                console.log('Update counter or name')
            }, [counter, name])

            return (
                <>
                <div>
                    <label>Name:</label>
                    <input onChange={e => setName(e.target.value)} />
                </div>
                <p>Counter : {counter}</p>
                <button onClick={() => setCounter(10)}>Update</button>
                <button onClick={() => setCounter((prevValue) => prevValue + 1)}>Increase</button>
                <button onClick={() => setCounter((prevValue) => prevValue - 1)}>Decrease</button>
                </>
            )
        }

        function App() {
            const [show, setShow] = React.useState(true)

            return (
                <main>
                <button onClick={() => setShow ((prev) => !prev)}>Show/Hide</button>
                    <hr/>
                    {show && <Counter />}
                </main>
      )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/ >)
    </script>

    
</body>

</html>
